<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>New Eye Testing - OptiCore</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <div class="app">

        <!-- Header -->
        <header class="header">
            <a class="brand" href="dashboard.html">
                <span class="brand-logo">◉</span>
                <span>
                    OptiCore
                    <small>Optical Shop Management</small>
                </span>
            </a>

            <div class="header-right">
                <span class="pill">Demo Store • Online</span>
                <div class="user">
                    <span class="avatar">NA</span>
                    <span>Nitin ▾</span>
                </div>
            </div>
        </header>
        <div id="sidebar-container"></div>
        <div class="layout">

            <!-- Sidebar -->
            <!-- Main Content -->
            <main class="content">

                <div class="page-head">
                    <div>
                        <h1 class="page-title">New Eye Testing</h1>
                        <div class="subtitle">
                            Record customer details and eye testing parameters.
                        </div>
                    </div>
                </div>

                <!-- Eye Testing Card -->
                <div class="card">

                    <div class="card-head">
                        <span class="card-title">Eye Testing</span>
                        <span class="badge blue">ET-00982</span>
                    </div>

                    <div class="card-body">

                        <!-- Customer Details -->
                        <div class="form-grid">

                            <div class="field span2">
                                <label>Customer *</label>
                                <select>
                                    <option>Rahul Patil — 98765 43210</option>
                                    <option>Neha Sharma — 98220 11223</option>
                                    <option>Walk-in Customer</option>
                                </select>
                            </div>

                            <div class="field">
                                <label>Test Date</label>
                                <input type="date" value="2026-09-29">
                            </div>

                            <div class="field">
                                <label>Doctor / Optometrist</label>
                                <input value="Dr. Mehta">
                            </div>

                        </div>


                        <!-- Eye Parameters -->
                        <!-- Eye Parameters -->
                        <div class="section">

                            <div class="section">

                                <div class="lens-layout">

                                    <div class="eye-sections">

                                        <!-- RIGHT EYE -->
                                        <div class="eye-section">

                                            <div class="eye-section-title">
                                                Right Eye (OD)
                                            </div>

                                            <div class="eye-grid">

                                                <div></div>
                                                <div class="head">SPH</div>
                                                <div class="head">CYL</div>
                                                <div class="head">AXIS</div>
                                                <div class="head">V/N</div>
                                                <div class="head">SPH</div>
                                                <div class="head">CYL</div>

                                                <div class="eye-label">Right</div>
                                                <input placeholder="SPH">
                                                <input placeholder="CYL">
                                                <input placeholder="Axis">
                                                <input placeholder="V/N">
                                                <input placeholder="SPH">
                                                <input placeholder="CYL">

                                                <div class="eye-label">D.V.</div>
                                                <input placeholder="SPH">
                                                <input placeholder="CYL">
                                                <input placeholder="Axis">
                                                <input placeholder="V/N">
                                                <input placeholder="SPH">
                                                <input placeholder="CYL">

                                                <div class="eye-label">N.V.</div>
                                                <input placeholder="SPH">
                                                <input placeholder="CYL">
                                                <input placeholder="Axis">
                                                <input placeholder="V/N">
                                                <input placeholder="SPH">
                                                <input placeholder="CYL">

                                                <div class="eye-label">ADD</div>
                                                <input placeholder="ADD">
                                                <input>
                                                <input>
                                                <input>
                                                <input placeholder="ADD">
                                                <input>

                                            </div>

                                        </div>


                                        <!-- LEFT EYE -->
                                        <div class="eye-section">

                                            <div class="eye-section-title">
                                                Left Eye (OS)
                                            </div>

                                            <div class="eye-grid">

                                                <div></div>
                                                <div class="head">SPH</div>
                                                <div class="head">CYL</div>
                                                <div class="head">AXIS</div>
                                                <div class="head">V/N</div>
                                                <div class="head">SPH</div>
                                                <div class="head">CYL</div>

                                                <div class="eye-label">Left</div>
                                                <input placeholder="SPH">
                                                <input placeholder="CYL">
                                                <input placeholder="Axis">
                                                <input placeholder="V/N">
                                                <input placeholder="SPH">
                                                <input placeholder="CYL">

                                                <div class="eye-label">D.V.</div>
                                                <input placeholder="SPH">
                                                <input placeholder="CYL">
                                                <input placeholder="Axis">
                                                <input placeholder="V/N">
                                                <input placeholder="SPH">
                                                <input placeholder="CYL">

                                                <div class="eye-label">N.V.</div>
                                                <input placeholder="SPH">
                                                <input placeholder="CYL">
                                                <input placeholder="Axis">
                                                <input placeholder="V/N">
                                                <input placeholder="SPH">
                                                <input placeholder="CYL">

                                                <div class="eye-label">ADD</div>
                                                <input placeholder="ADD">
                                                <input>
                                                <input>
                                                <input>
                                                <input placeholder="ADD">
                                                <input>

                                            </div>

                                        </div>

                                    </div>


                                    <!-- RIGHT SIDE INFORMATION -->



                                </div>

                            </div>

                        </div>


                        <!-- Notes -->
                        <div class="section">

                            <div class="field">
                                <label>Notes</label>
                                <textarea rows="3"
                                          placeholder="Enter any additional observation or testing notes..."></textarea>
                            </div>

                        </div>


                        <!-- Test Charges -->
                        <div class="section">

                            <div class="card">

                                <div class="card-head">
                                    <span class="card-title">Test Charges</span>
                                </div>

                                <div class="card-body">

                                    <div class="form-grid">

                                        <div class="field">
                                            <label>Test Type *</label>

                                            <div style="display:flex;gap:20px;align-items:center;margin-top:8px;">

                                                <label style="display:flex;align-items:center;gap:6px;">
                                                    <input type="radio"
                                                           name="testType"
                                                           value="free"
                                                           checked>
                                                    Free Test
                                                </label>

                                                <label style="display:flex;align-items:center;gap:6px;">
                                                    <input type="radio"
                                                           name="testType"
                                                           value="paid">
                                                    Pay Test
                                                </label>

                                            </div>
                                        </div>


                                        <div class="field">
                                            <label>Amount Paid (₹)</label>

                                            <input type="number"
                                                   id="amountPaid"
                                                   placeholder="Enter amount"
                                                   disabled>

                                        </div>

                                    </div>

                                </div>

                            </div>

                        </div>


                        <!-- Actions -->
                        <div class="actions"
                             style="justify-content:flex-end;margin-top:20px;gap:10px;">

                            <a class="btn" href="prescriptions.html">
                                Cancel
                            </a>

                            <button class="btn" type="button" onclick="printEyeTest()">
                                Print
                            </button>

                            <button class="btn"
                                    type="button"
                                    onclick="saveFreeTest()">
                                Free Test
                            </button>

                            <button class="btn primary"
                                    type="button"
                                    onclick="savePaidTest()">
                                Pay Test
                            </button>

                        </div>

                    </div>
                </div>

            </main>

        </div>
    </div>


    <script src="js/app.js"></script>

    <script>

        // Enable / disable amount based on test type
        const testTypeRadios = document.querySelectorAll(
            'input[name="testType"]'
        );

        const amountPaid = document.getElementById("amountPaid");

        testTypeRadios.forEach(radio => {

            radio.addEventListener("change", function () {

                if (this.value === "paid") {

                    amountPaid.disabled = false;
                    amountPaid.focus();

                } else {

                    amountPaid.disabled = true;
                    amountPaid.value = "";

                }

            });

        });


        // Free Test
        function saveFreeTest() {

            document.querySelector(
                'input[name="testType"][value="free"]'
            ).checked = true;

            amountPaid.disabled = true;
            amountPaid.value = "";

            alert("Eye Test saved as Free Test.");

        }


        // Paid Test
        function savePaidTest() {

            const amount = amountPaid.value;

            if (!amount || Number(amount) <= 0) {

                alert("Please enter the amount paid.");

                amountPaid.focus();

                return;
            }

            document.querySelector(
                'input[name="testType"][value="paid"]'
            ).checked = true;

            alert("Eye Test saved. Amount Paid: ₹" + amount);

        }


        // Print
        function printEyeTest() {

            window.print();

        }

    </script>

</body>
</html>
